<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="LEECO · 樂創元件库">
  <title>LEECO · 樂創元件库</title>
  <desc>单色靛蓝品牌横幅：圆角 L 形印章、LEECO 字标与料格网格装饰。</desc>

  <rect width="1200" height="280" fill="#2b3196" />

  <!-- 右侧料格：三个空心格 + 唯一薄荷点，呼应标记的 2×2 意象，不使用纹理渐变 -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="1.4">
    <rect x="892" y="72" width="72" height="72" rx="14" />
    <rect x="972" y="152" width="72" height="72" rx="14" />
    <rect x="1052" y="72" width="72" height="72" rx="14" />
  </g>
  <rect x="1019" y="99" width="18" height="18" rx="5" fill="#b9fff0" fill-opacity=".92" />

  <!-- 品牌印章：与 src/shared/ui/BrandMark.vue 完全同构 -->
  <rect x="64" y="60" width="152" height="152" rx="45" fill="#3f49c9" stroke="#ffffff" stroke-opacity=".2" stroke-width="1.2" />
  <g transform="translate(88.32 84.32) scale(4.3067)">
    <path d="M7.4 5.5v10.7a2.6 2.6 0 0 0 2.6 2.6H19.2" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="14.5" y="5.4" width="4.7" height="4.7" rx="1.5" fill="#b9fff0" />
  </g>

  <!-- 字标 -->
  <text x="252" y="132" fill="#ffffff" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="13">LEECO</text>
  <text x="254" y="162" fill="#ffffff" fill-opacity=".52" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" letter-spacing="4.2">PARTS INVENTORY SYSTEM</text>
  <text x="254" y="197" fill="#b9fff0" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="500" letter-spacing="2.6">找料 · 验料 · 用料</text>

  <!-- 页脚 -->
  <path d="M64 240H1136" stroke="#ffffff" stroke-opacity=".14" stroke-width="1" />
  <text x="64" y="263" fill="#ffffff" fill-opacity=".46" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" letter-spacing="2.4">VUE 3  ·  TYPESCRIPT  ·  EDGEONE SERVERLESS  ·  EDGE KV</text>
  <text x="1136" y="263" text-anchor="end" fill="#ffffff" fill-opacity=".46" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" letter-spacing="2.4">v1.0  /  8 MODULES VERIFIED</text>
</svg>
